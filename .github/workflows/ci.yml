name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.27'
      - name: Sync dependencies
        run: uv sync --locked --extra dev --extra analysis
      - name: Lint
        run: uv run --locked ruff check .
      - name: Test
        run: uv run --locked pytest -q
      - name: Smoke test
        run: >-
          uv run --locked policy-lab --methods qac_full --steps 100 --eval-every 50
          --seeds 0 --out-dir artifacts/ci/data
      - name: Plot smoke test
        run: uv run --locked policy-lab-plot artifacts/ci/data --out-dir artifacts/ci/analysis
